services:
  web:
    networks:
      - frontend
      - connector

  connector:
    image: ${ACEARCHIVE_CONNECTOR_IMAGE:?You must set ACEARCHIVE_CONNECTOR_IMAGE to use the Ace Archive overlay.}
    ports:
      - "127.0.0.1:${ACEARCHIVE_CONNECTOR_PORT:-8081}:80"
    environment:
      - PORT=80
      - OMEKA_URL=http://web
      - BASE_DOMAIN=${ACEARCHIVE_CONNECTOR_BASE_DOMAIN:-acearchive.lgbt}
      - FILES_URL=${ACEARCHIVE_CONNECTOR_FILES_URL:-https://files.acearchive.lgbt}
      - SCRATCH_DIR=/scratch
    volumes:
      # The image must create this directory, and it must be owned by the
      # acting user.
      - connector-scratch:/scratch:rw
    networks:
      - connector
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    deploy:
      resources:
        limits:
          cpus: "${ACEARCHIVE_CONNECTOR_CPU_LIMIT:-0.5}"
          memory: ${ACEARCHIVE_CONNECTOR_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  connector: {}

volumes:
  connector-scratch:
    driver: local
